name: Compilation du firmware

on:
  push:
    paths:
      - '**.ino'
      - '**.h'
      - '**.cpp'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # nÃ©cessaire pour crÃ©er une release sur un tag

env:
  # Version du core figÃ©e : la compilation en ligne produit ainsi exactement
  # le mÃªme binaire que la compilation locale.
  CORE: Seeeduino:nrf52@1.1.13
  FQBN: Seeeduino:nrf52:xiaonRF52840Sense
  INDEX: https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
  UF2_FAMILY: '0xADA52840'      # identifiant de famille du nRF52840

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: RÃ©cupÃ©ration du dÃ©pÃ´t
        uses: actions/checkout@v5

      # Installation par le script officiel plutÃ´t que par l'action
      # arduino/setup-arduino-cli : celle-ci tourne encore sur Node 20 et
      # provoque un avertissement de dÃ©prÃ©ciation Ã  chaque compilation.
      - name: Installation d'arduino-cli
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version

      # Le core pÃ¨se plusieurs centaines de Mo : le cache fait passer les
      # compilations suivantes de plusieurs minutes Ã  environ une minute.
      - name: Cache du core et des bibliothÃ¨ques
        uses: actions/cache@v5
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ env.CORE }}-v4

      - name: Installation du core Seeed nRF52
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$INDEX"
          arduino-cli core update-index
          arduino-cli core install "$CORE"
          echo "--- cores installÃ©s ---"
          arduino-cli core list

      # On n'installe QUE les bibliothÃ¨ques absentes du core. Adafruit TinyUSB,
      # SdFat et Adafruit SPIFlash sont fournis par le core : les rÃ©installer
      # recrÃ©erait l'ambiguÃ¯tÃ© du type Â« File Â» qui casse bonding.cpp.
      - name: Installation des bibliothÃ¨ques
        run: |
          set -uo pipefail
          arduino-cli lib update-index

          install_lib () {
            echo "::group::Installation de $1"
            if arduino-cli lib install "$1"; then
              echo "$1 : installÃ©e depuis l'index"
              echo "::endgroup::"; return 0
            fi
            echo "::warning::'$1' absente de l'index, tentative via GitHub ($2)"
            arduino-cli config set library.enable_unsafe_install true
            if arduino-cli lib install --git-url "$2"; then
              echo "$1 : installÃ©e depuis GitHub"
              echo "::endgroup::"; return 0
            fi
            echo "::error::Impossible d'installer $1"
            echo "::endgroup::"; return 1
          }

          install_lib "SparkFun u-blox GNSS Arduino Library" \
            "https://github.com/sparkfun/SparkFun_u-blox_GNSS_Arduino_Library.git"
          install_lib "Seeed Arduino LSM6DS3" \
            "https://github.com/Seeed-Studio/Seeed_Arduino_LSM6DS3.git"

          echo "--- bibliothÃ¨ques prÃ©sentes ---"
          arduino-cli lib list

      - name: Localisation du croquis
        id: sketch
        run: |
          set -euo pipefail
          INO=$(find . -name '*.ino' -not -path './.git/*' | head -n 1)
          if [ -z "$INO" ]; then
            echo "::error::Aucun fichier .ino trouvÃ© dans le dÃ©pÃ´t."
            echo "Contenu du dÃ©pÃ´t :"; find . -maxdepth 2 -not -path './.git*'
            exit 1
          fi
          NAME=$(basename "$INO" .ino)
          DIR=$(dirname "$INO")
          # Un croquis Arduino doit vivre dans un dossier portant son nom.
          if [ "$(basename "$DIR")" != "$NAME" ]; then
            echo "RÃ©organisation : le dossier ne porte pas le nom du croquis."
            mkdir -p "build-src/$NAME"
            cp "$INO" "build-src/$NAME/"
            find "$DIR" -maxdepth 1 \( -name '*.h' -o -name '*.cpp' \) \
              -exec cp {} "build-src/$NAME/" \; 2>/dev/null || true
            DIR="build-src/$NAME"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR"   >> "$GITHUB_OUTPUT"
          echo "Croquis retenu : $DIR ($NAME.ino)"

      - name: Compilation
        run: |
          set -euo pipefail
          arduino-cli compile \
            --fqbn "$FQBN" \
            --export-binaries \
            --warnings default \
            "${{ steps.sketch.outputs.dir }}"

      # Le core produit lui-mÃªme le .zip DFU, avec le bon identifiant de
      # SoftDevice. On n'ajoute que la conversion en UF2.
      - name: Conversion en UF2
        run: |
          set -euo pipefail
          BIN="${{ steps.sketch.outputs.dir }}/build"
          HEX=$(find "$BIN" -name '*.hex' ! -name '*with_bootloader*' | head -n 1)
          if [ -z "$HEX" ]; then
            echo "::error::Aucun .hex produit par la compilation."
            find "$BIN" -type f | head -50
            exit 1
          fi
          echo "Fichier source : $HEX"
          curl -sSLO https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py
          curl -sSLO https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json
          mkdir -p dist uf2
          python3 uf2conv.py "$HEX" -c -f "$UF2_FAMILY" \
            -o "uf2/${{ steps.sketch.outputs.name }}.uf2"
          cp "uf2/${{ steps.sketch.outputs.name }}.uf2" dist/
          ZIP=$(find "$BIN" -name '*.zip' | head -n 1)
          if [ -n "$ZIP" ]; then
            cp "$ZIP" "dist/${{ steps.sketch.outputs.name }}-dfu.zip"
          else
            echo "::warning::Pas de paquet DFU gÃ©nÃ©rÃ© par le core."
          fi
          cp "$HEX" dist/
          ls -lh dist/

      - name: RÃ©capitulatif
        run: |
          {
            echo "### Firmware compilÃ©"
            echo ""
            echo "| Fichier | Taille | Usage |"
            echo "|---|---|---|"
            for f in dist/*; do
              n=$(basename "$f"); s=$(du -h "$f" | cut -f1)
              case "$n" in
                *.uf2)     u="Glisser-dÃ©poser sur le lecteur XIAO (double appui sur RESET)";;
                *-dfu.zip) u="Mise Ã  jour Bluetooth via nRF Connect";;
                *.hex)     u="Programmation par sonde SWD";;
                *)         u="â€”";;
              esac
              echo "| \`$n\` | $s | $u |"
            done
            echo ""
            echo "Sur tÃ©lÃ©phone, tÃ©lÃ©chargez l'artefact **firmware-uf2** :"
            echo "il se tÃ©lÃ©charge tel quel, sans dÃ©compression."
          } >> "$GITHUB_STEP_SUMMARY"

      # Artefact non compressÃ© : le .uf2 se tÃ©lÃ©charge directement, sans
      # passer par une archive Ã  extraire â€” indispensable sur tÃ©lÃ©phone.
      - name: Publication du UF2 (tÃ©lÃ©chargement direct)
        uses: actions/upload-artifact@v7
        with:
          name: firmware-uf2
          path: uf2/
          archive: false
          retention-days: 90

      - name: Publication de tous les fichiers
        uses: actions/upload-artifact@v7
        with:
          name: firmware-complet
          path: dist/
          retention-days: 90

      # Sur un tag (ex. v1.0), les fichiers sont attachÃ©s Ã  une release :
      # l'URL devient stable et directement tÃ©lÃ©chargeable.
      - name: CrÃ©ation de la release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" dist/* --title "$TAG" \
            --notes "Firmware compilÃ© automatiquement depuis $GITHUB_SHA." \
            || gh release upload "$TAG" dist/* --clobber
