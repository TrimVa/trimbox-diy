name: Compilation du firmware

# Se dÃ©clenche Ã  chaque modification du code, et manuellement depuis
# l'onglet Actions (bouton Â« Run workflow Â»), y compris depuis un tÃ©lÃ©phone.
on:
  push:
    paths:
      - '**.ino'
      - '**.h'
      - '**.cpp'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

env:
  # Version du core figÃ©e : garantit que la compilation en ligne produit
  # exactement le mÃªme binaire que la compilation locale.
  CORE: Seeeduino:nrf52@1.1.13
  FQBN: Seeeduino:nrf52:xiaonRF52840Sense
  INDEX: https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
  UF2_FAMILY: '0xADA52840'      # identifiant de famille du nRF52840

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: RÃ©cupÃ©ration du dÃ©pÃ´t
        uses: actions/checkout@v4

      - name: Installation d'arduino-cli
        uses: arduino/setup-arduino-cli@v2

      # Le core pÃ¨se plusieurs centaines de Mo : le garder en cache fait
      # passer les compilations suivantes de ~4 min Ã  ~1 min.
      - name: Cache du core et des bibliothÃ¨ques
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ env.CORE }}-v3

      - name: Installation du core Seeed nRF52
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$INDEX"
          arduino-cli core update-index
          arduino-cli core install "$CORE"

      # On n'installe QUE les bibliothÃ¨ques absentes du core.
      # Adafruit TinyUSB, SdFat et Adafruit SPIFlash sont fournis par le core :
      # les rÃ©installer recrÃ©erait le conflit de type Â« File Â» qui casse la
      # compilation de bonding.cpp dans Bluefruit.
      - name: Installation des bibliothÃ¨ques
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "SparkFun u-blox GNSS Arduino Library"
          # Le nom exact de la bibliothÃ¨que LSM6DS3 a variÃ© selon les versions
          # de l'index : on essaie les variantes connues, puis on se rabat sur
          # le dÃ©pÃ´t officiel Seeed.
          if ! arduino-cli lib install "Seeed Arduino LSM6DS3"; then
            echo "::warning::Nom d'index introuvable, installation depuis GitHub."
            arduino-cli config set library.enable_unsafe_install true
            arduino-cli lib install --git-url \
              https://github.com/Seeed-Studio/Seeed_Arduino_LSM6DS3.git
          fi
          echo "--- bibliothÃ¨ques prÃ©sentes ---"
          arduino-cli lib list

      - name: Localisation du croquis
        id: sketch
        run: |
          # Un croquis Arduino doit vivre dans un dossier portant son nom.
          INO=$(find . -name '*.ino' -not -path './.git/*' | head -n 1)
          if [ -z "$INO" ]; then
            echo "::error::Aucun fichier .ino trouvÃ© dans le dÃ©pÃ´t."
            exit 1
          fi
          COUNT=$(find . -name '*.ino' -not -path './.git/*' | wc -l)
          if [ "$COUNT" -gt 1 ]; then
            echo "::warning::$COUNT fichiers .ino trouvÃ©s, compilation de $INO"
          fi
          NAME=$(basename "$INO" .ino)
          DIR=$(dirname "$INO")
          # Recopie dans une arborescence conforme si ce n'est pas dÃ©jÃ  le cas.
          if [ "$(basename "$DIR")" != "$NAME" ]; then
            mkdir -p "build-src/$NAME"
            cp "$INO" "build-src/$NAME/"
            find "$DIR" -maxdepth 1 \( -name '*.h' -o -name '*.cpp' \) \
              -exec cp {} "build-src/$NAME/" \; 2>/dev/null || true
            DIR="build-src/$NAME"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR"   >> "$GITHUB_OUTPUT"
          echo "Croquis : $DIR ($NAME)"

      - name: Compilation
        run: |
          arduino-cli compile \
            --fqbn "$FQBN" \
            --export-binaries \
            --warnings default \
            "${{ steps.sketch.outputs.dir }}"

      # Le core produit le .hex et, via sa recette intÃ©grÃ©e, le .zip DFU
      # signÃ© avec le bon identifiant de SoftDevice. On n'a qu'Ã  ajouter l'UF2.
      - name: Conversion en UF2
        run: |
          BIN="${{ steps.sketch.outputs.dir }}/build"
          HEX=$(find "$BIN" -name '*.hex' ! -name '*with_bootloader*' | head -n 1)
          if [ -z "$HEX" ]; then
            echo "::error::Aucun .hex produit par la compilation."
            find "$BIN" -type f | head -50
            exit 1
          fi
          echo "Fichier source : $HEX"
          curl -sSLO https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py
          curl -sSLO https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json
          mkdir -p dist
          python3 uf2conv.py "$HEX" -c -f "$UF2_FAMILY" \
            -o "dist/${{ steps.sketch.outputs.name }}.uf2"
          # Le paquet DFU sert Ã  la mise Ã  jour par Bluetooth (nRF Connect).
          ZIP=$(find "$BIN" -name '*.zip' | head -n 1)
          [ -n "$ZIP" ] && cp "$ZIP" "dist/${{ steps.sketch.outputs.name }}-dfu.zip"
          cp "$HEX" "dist/"
          ls -lh dist/

      - name: RÃ©capitulatif
        run: |
          {
            echo "### Firmware compilÃ©"
            echo ""
            echo "| Fichier | Taille | Usage |"
            echo "|---|---|---|"
            for f in dist/*; do
              n=$(basename "$f"); s=$(du -h "$f" | cut -f1)
              case "$n" in
                *.uf2)     u="Glisser-dÃ©poser sur le lecteur XIAO (double appui sur RESET)";;
                *-dfu.zip) u="Mise Ã  jour Bluetooth via nRF Connect";;
                *.hex)     u="Programmation par sonde SWD";;
                *)         u="â€”";;
              esac
              echo "| \`$n\` | $s | $u |"
            done
            echo ""
            echo "TÃ©lÃ©chargez l'archive **firmware** en bas de cette page."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publication des fichiers
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          retention-days: 90

      # Sur un tag (ex. v1.0), les fichiers sont aussi attachÃ©s Ã  une release :
      # l'URL est alors stable et directement tÃ©lÃ©chargeable sur tÃ©lÃ©phone.
      - name: CrÃ©ation de la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
